name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev libsqlite3-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Build debug APK
        run: buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Text2QR-Pro-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
